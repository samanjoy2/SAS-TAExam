server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Runtime config must never be cached, so a changed API_BASE_URL takes effect immediately.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Vite puts a content hash in every asset file name, so these can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /holds/h_123) are served index.html.
    # index.html must be revalidated on every load, otherwise browsers keep running an old build
    # after a redeploy (found during testing: a CSS fix did not show up until a hard reload).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
